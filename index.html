<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eoffice Supporter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --vtb-blue: #004E9A;
      --vtb-blue-deep: #00326B;
      --vtb-blue-mid: #0066B3;
      --vtb-red: #E31C23;
      --vtb-red-dark: #B8141A;
      --vtb-bg: #F4F7FB;
      --vtb-white: #FFFFFF;
      --vtb-text: #1A2332;
      --vtb-muted: #5B6B7C;
      --header-h: 96px;
      --tab-h: 48px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: var(--vtb-bg);
      color: var(--vtb-text);
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    .header {
      height: var(--header-h);
      background: linear-gradient(90deg, var(--vtb-blue-deep) 0%, var(--vtb-blue) 55%, var(--vtb-blue-mid) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 50, 107, 0.25);
    }

    .header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--vtb-red) 0%, var(--vtb-red) 28%, var(--vtb-blue-mid) 28%, var(--vtb-blue-mid) 100%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--vtb-white);
    }

    .logo-mark {
      width: 80px;
      height: 80px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .header-meta {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }

    .tabs {
      display: flex;
      background: var(--vtb-white);
      border-bottom: 1px solid #D6DEE8;
      height: var(--tab-h);
      flex-shrink: 0;
      padding: 0 16px;
      gap: 4px;
    }

    .tab-btn {
      appearance: none;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--vtb-muted);
      padding: 0 20px;
      height: 100%;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
      transition: color 0.2s ease, background 0.2s ease;
      min-height: 44px;
    }

    .tab-btn:hover {
      color: var(--vtb-blue);
      background: #F0F5FB;
    }

    .tab-btn:focus-visible {
      outline: 2px solid var(--vtb-blue);
      outline-offset: -2px;
    }

    .tab-btn[aria-selected="true"] {
      color: var(--vtb-blue);
    }

    .tab-btn[aria-selected="true"]::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 0;
      height: 3px;
      background: var(--vtb-red);
      border-radius: 3px 3px 0 0;
    }

    .tab-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .panels {
      flex: 1;
      min-height: 0;
      position: relative;
      background: var(--vtb-bg);
    }

    .panel {
      display: none;
      height: 100%;
    }

    .panel.active {
      display: block;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--vtb-white);
    }

    @media (max-width: 640px) {
      .header { padding: 0 12px; }
      .header-meta { display: none; }
      .brand-name { font-size: 16px; }
      .tab-btn { padding: 0 12px; font-size: 13px; }
      .tabs { padding: 0 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tab-btn { transition: none; }
    }
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html" aria-label="VietinBank">
      <video class="logo-mark" src="logo.mp4" autoplay loop muted playsinline aria-hidden="true"></video>
      <span class="brand-text">
        <span class="brand-name">VIETINBANK BÌNH THUẬN</span>
        <span class="brand-sub">Công cụ hỗ trợ thanh toán trên Eoffice</span>
      </span>
    </a>
    <span class="header-meta">toanbx@vietinbank.vn</span>
  </header>

  <nav class="tabs" role="tablist" aria-label="Cong cu">
    <button
      class="tab-btn"
      role="tab"
      id="tab-vnd"
      aria-selected="true"
      aria-controls="panel-vnd"
      data-tab="vnd"
    >
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M7 9h6M7 13h10M7 17h4"/>
      </svg>
      CHUYỂN SỐ THÀNH CHỮ
    </button>
    <button
      class="tab-btn"
      role="tab"
      id="tab-hstt"
      aria-selected="false"
      aria-controls="panel-hstt"
      data-tab="hstt"
    >
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="M20 20l-3.5-3.5"/>
      </svg>
      TRA CỨU HỒ SƠ TT
    </button>
    <button
      class="tab-btn"
      role="tab"
      id="tab-lx600"
      aria-selected="false"
      aria-controls="panel-lx600"
      data-tab="lx600"
    >
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
        <path d="M14 3v6h6M8 13h8M8 17h5"/>
      </svg>
      TỔNG HỢP XML
    </button>
  </nav>

  <main class="panels">
    <section class="panel active" role="tabpanel" id="panel-vnd" aria-labelledby="tab-vnd">
      <iframe src="vnd_v2.html" title="Chuyen so thanh chu - vnd_v2"></iframe>
    </section>
    <section class="panel" role="tabpanel" id="panel-hstt" aria-labelledby="tab-hstt" hidden>
      <iframe src="tra_cuu_ho_so_thanh_toan_v6.html" title="Tra cuu ho so thanh toan"></iframe>
    </section>
    <section class="panel" role="tabpanel" id="panel-lx600" aria-labelledby="tab-lx600" hidden>
      <iframe src="lx600.html" title="Hoa don XML LX600"></iframe>
    </section>
  </main>

  <script>
    (function () {
      var buttons = document.querySelectorAll(".tab-btn");
      var panels = {
        vnd: document.getElementById("panel-vnd"),
        hstt: document.getElementById("panel-hstt"),
        lx600: document.getElementById("panel-lx600")
      };

      function activate(name) {
        buttons.forEach(function (btn) {
          var on = btn.getAttribute("data-tab") === name;
          btn.setAttribute("aria-selected", on ? "true" : "false");
        });
        Object.keys(panels).forEach(function (key) {
          var panel = panels[key];
          var on = key === name;
          panel.classList.toggle("active", on);
          if (on) panel.removeAttribute("hidden");
          else panel.setAttribute("hidden", "");
        });
      }

      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          activate(btn.getAttribute("data-tab"));
        });
        btn.addEventListener("keydown", function (e) {
          if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
          e.preventDefault();
          var list = Array.prototype.slice.call(buttons);
          var i = list.indexOf(btn);
          var next = e.key === "ArrowRight"
            ? list[(i + 1) % list.length]
            : list[(i - 1 + list.length) % list.length];
          next.focus();
          activate(next.getAttribute("data-tab"));
        });
      });
    })();
  </script>
</body>
</html>
