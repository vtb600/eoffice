<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chuyen so thanh chu | VietinBank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --vtb-blue: #004E9A;
  --vtb-blue-deep: #00326B;
  --vtb-blue-mid: #0066B3;
  --vtb-blue-soft: #E8F1FA;
  --vtb-red: #E31C23;
  --vtb-red-dark: #B8141A;
  --vtb-red-soft: #FDECEC;
  --vtb-bg: #F0F4F9;
  --vtb-white: #FFFFFF;
  --vtb-text: #1A2332;
  --vtb-muted: #5B6B7C;
  --vtb-border: #D4DEEA;
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%;
  font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
  background: var(--vtb-bg);
  color: var(--vtb-text);
}

body { padding: 20px; }

.wrap {
  display: flex;
  gap: 20px;
  align-items: stretch;
  max-width: 1120px;
  margin: 0 auto;
}

.card {
  flex: 1;
  min-width: 0;
  background: var(--vtb-white);
  border-radius: var(--radius);
  box-shadow: 0 4px 20px rgba(0, 50, 107, 0.08);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  color: #fff;
  position: relative;
}

.card-head.red {
  background: linear-gradient(135deg, var(--vtb-red-dark) 0%, var(--vtb-red) 100%);
}

.card-head.blue {
  background: linear-gradient(135deg, var(--vtb-blue-deep) 0%, var(--vtb-blue-mid) 100%);
}

.card-head::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
}

.card-head.red::after { background: var(--vtb-blue); }
.card-head.blue::after { background: var(--vtb-red); }

.card-icon {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: rgba(255,255,255,0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.card-icon svg { width: 20px; height: 20px; }

.card-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1.2;
}

.card-sub {
  font-size: 11px;
  font-weight: 500;
  opacity: 0.85;
  margin-top: 2px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.card-body { padding: 20px; flex: 1; }

label {
  font-weight: 600;
  font-size: 13px;
  color: var(--vtb-blue-deep);
  display: block;
  margin-bottom: 6px;
}

.field { margin-bottom: 14px; }

input[type=text], textarea, .calc-input {
  width: 100%;
  padding: 11px 14px;
  font-size: 15px;
  font-family: inherit;
  border: 1.5px solid var(--vtb-border);
  border-radius: 8px;
  background: #FAFCFF;
  color: var(--vtb-text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}

input[type=text]:hover, textarea:hover, .calc-input:hover {
  border-color: #A8C0D8;
}

input[type=text]:focus, textarea:focus, .calc-input:focus {
  border-color: var(--vtb-blue);
  box-shadow: 0 0 0 3px rgba(0, 78, 154, 0.16);
  background: #fff;
}

#amount {
  font-size: 22px;
  font-weight: 700;
  color: var(--vtb-blue-deep);
  letter-spacing: 0.02em;
}

#result {
  min-height: 88px;
  resize: vertical;
  background: var(--vtb-blue-soft);
  border-color: #B8D0E8;
  color: var(--vtb-blue-deep);
  font-weight: 600;
  line-height: 1.5;
}

#result:focus {
  border-color: var(--vtb-blue);
  background: #F3F8FD;
}

.btn-copy {
  width: 100%;
  min-height: 44px;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--vtb-red-dark), var(--vtb-red));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
  box-shadow: 0 2px 8px rgba(227, 28, 35, 0.28);
}

.btn-copy:hover {
  filter: brightness(1.06);
  box-shadow: 0 4px 12px rgba(227, 28, 35, 0.36);
}

.btn-copy:active { transform: scale(0.98); }

.btn-copy:focus-visible {
  outline: 2px solid var(--vtb-blue);
  outline-offset: 2px;
}

.btn-copy.copied {
  background: linear-gradient(135deg, #0B6B3A, #178A4B);
  box-shadow: 0 2px 8px rgba(23, 138, 75, 0.28);
}

.note-area {
  min-height: 96px;
  resize: vertical;
}

.calc-input {
  font-family: "IBM Plex Mono", monospace;
  font-size: 15px;
  white-space: pre-wrap;
  word-break: break-all;
  height: auto;
  min-height: 48px;
  resize: none;
}

.calc-hint {
  font-size: 12px;
  color: var(--vtb-muted);
  margin-top: 6px;
  margin-bottom: 12px;
}

.calc-history {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 340px;
  overflow-y: auto;
}

.calc-row {
  background: var(--vtb-blue-soft);
  border: 1px solid #D0E2F2;
  border-left: 3px solid var(--vtb-blue);
  border-radius: 8px;
  padding: 10px 12px;
}

.calc-expr-txt {
  font-size: 12px;
  color: var(--vtb-muted);
  font-family: "IBM Plex Mono", monospace;
  word-break: break-all;
}

.calc-res {
  font-size: 18px;
  font-weight: 600;
  color: var(--vtb-blue-deep);
  font-family: "IBM Plex Mono", monospace;
  word-break: break-all;
  margin-top: 2px;
}

.calc-res.err {
  font-size: 13px;
  color: var(--vtb-red);
  border-left-color: var(--vtb-red);
}

.calc-row:has(.err) {
  background: var(--vtb-red-soft);
  border-color: #F5C4C6;
  border-left-color: var(--vtb-red);
}

.clear-btn {
  margin-top: 12px;
  min-height: 36px;
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  color: var(--vtb-red);
  cursor: pointer;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 6px 8px;
  align-self: flex-start;
}

.clear-btn:hover {
  background: var(--vtb-red-soft);
  border-color: #F5C4C6;
}

.clear-btn:focus-visible {
  outline: 2px solid var(--vtb-red);
  outline-offset: 2px;
}

@media (max-width: 760px) {
  body { padding: 12px; }
  .wrap { flex-direction: column; gap: 16px; }
  #amount { font-size: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  input, textarea, .btn-copy, .clear-btn { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <div class="card-head red">
      <div class="card-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="M7 10h4M7 14h10"/>
        </svg>
      </div>
      <div>
        <h1 class="card-title">Chuyen so tien thanh chu</h1>
        <p class="card-sub">toanbx · v2.0</p>
      </div>
    </div>
    <div class="card-body">
      <div class="field">
        <label for="amount">So tien</label>
        <input type="text" id="amount" placeholder="Nhap so tien" inputmode="decimal" autocomplete="off">
      </div>
      <div class="field">
        <label for="result">So tien bang chu</label>
        <textarea id="result" readonly placeholder="Ket qua se hien thi tai day"></textarea>
      </div>
      <button class="btn-copy" type="button" onclick="copyText()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="9" y="9" width="11" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Sao chep ket qua
      </button>
      <div class="field" style="margin-top:16px;margin-bottom:0">
        <label for="note">Ghi chu</label>
        <textarea id="note" class="note-area" placeholder="Nhap ghi chu tai day..."></textarea>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-head blue">
      <div class="card-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
          <rect x="4" y="3" width="16" height="18" rx="2"/>
          <path d="M8 8h8M8 12h8M8 16h5"/>
        </svg>
      </div>
      <div>
        <h1 class="card-title">May tinh</h1>
        <p class="card-sub">Nhap bieu thuc roi Enter</p>
      </div>
    </div>
    <div class="card-body">
      <div class="field" style="margin-bottom:0">
        <label for="calcIn">Bieu thuc</label>
        <textarea class="calc-input" id="calcIn" placeholder="VD: 1.500.000 * 2 + 300.000" rows="2" autocomplete="off" spellcheck="false"></textarea>
        <div class="calc-hint">Ho tro + - * / · dinh dang so kieu Viet Nam</div>
      </div>
      <div class="calc-history" id="history"></div>
      <button class="clear-btn" type="button" onclick="clearHistory()">Xoa lich su</button>
    </div>
  </section>
</div>
<script>
const chuSo=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
function docHangTram(n,full){let t=Math.floor(n/100),c=Math.floor((n%100)/10),d=n%10,s="";if(full||t>0){s+=chuSo[t]+" trăm";if(c===0&&d>0)s+=" lẻ"}if(c>1){s+=" "+chuSo[c]+" mươi";if(d===1)s+=" mốt";else if(d===5)s+=" lăm";else if(d>0)s+=" "+chuSo[d]}else if(c===1){s+=" mười";if(d===5)s+=" lăm";else if(d>0)s+=" "+chuSo[d]}else if(d>0)s+=" "+chuSo[d];return s.trim()}
function numberToVietnamese(num){if(num===0)return"Không";const units=["","nghìn","triệu","tỷ","nghìn tỷ","triệu tỷ"];let blocks=[];while(num>0){blocks.push(num%1000);num=Math.floor(num/1000)}let result="";for(let i=blocks.length-1;i>=0;i--){let b=blocks[i];if(b===0)continue;let full=(i<blocks.length-1);result+=docHangTram(b,full)+(units[i]?" "+units[i]:"")+" "}result=result.trim();return result.charAt(0).toUpperCase()+result.slice(1)}
function decimalToWords(d){if(!d)return"";return[...d].map(c=>chuSo[parseInt(c)]).join(" ")}
const inp=document.getElementById("amount");
const out=document.getElementById("result");
inp.addEventListener("input",function(){let raw=this.value.replace(/[^\d,]/g,"");let parts=raw.split(",");let ip=parts[0].replace(/\./g,"");if(ip){ip=ip.replace(/^0+(?!$)/,"");let fmt=Number(ip||0).toLocaleString("vi-VN");this.value=fmt;if(parts.length>1){let dp=parts[1].replace(/[^\d]/g,"").substring(0,10);this.value+=","+dp}let text=numberToVietnamese(parseInt(ip||"0"));if(parts.length>1&&parts[1]!=="")text+=" phẩy "+decimalToWords(parts[1]);text+=" đồng";out.value=text}else{out.value=""}});
function copyText(){const t=out.value;if(!t){alert("Chưa có nội dung để sao chép.");return}out.select();document.execCommand("copy");const btn=document.querySelector(".btn-copy");const old=btn.innerHTML;btn.classList.add("copied");btn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> Da sao chep';setTimeout(function(){btn.classList.remove("copied");btn.innerHTML=old},1600)}
const noteBox=document.getElementById("note");
noteBox.value=localStorage.getItem("note_toanbx")||"";
noteBox.addEventListener("input",function(){localStorage.setItem("note_toanbx",this.value)});

const calcIn=document.getElementById("calcIn");
const histEl=document.getElementById("history");

calcIn.addEventListener("input",function(){
  const sel=this.selectionStart,oldLen=this.value.length;
  const formatted=this.value.replace(/(\d[\d.,]*)/g,function(m){
    const digits=m.replace(/[.,]/g,"");
    return parseInt(digits).toLocaleString("vi-VN");
  });
  this.value=formatted;
  const diff=this.value.length-oldLen;
  this.setSelectionRange(sel+diff,sel+diff);
  this.style.height="auto";
  this.style.height=this.scrollHeight+"px";
});

function fmtResult(v){if(!isFinite(v))return"Lỗi";return parseFloat(v.toPrecision(12)).toLocaleString("vi-VN",{maximumFractionDigits:6})}

calcIn.addEventListener("keydown",function(e){
  if(e.key!=="Enter"){return}
  e.preventDefault();
  const raw=this.value.trim();if(!raw)return;
  let expr = raw.replace(/\./g,"").replace(/×/g,"*").replace(/÷/g,"/");
  let result,isErr=false;
  try{result=Function('"use strict";return ('+expr+')')();if(typeof result!=="number"||!isFinite(result)){isErr=true;result="Lỗi"}}
  catch(err){isErr=true;result="Biểu thức không hợp lệ"}
  const row=document.createElement("div");row.className="calc-row";
  const exprEl=document.createElement("div");exprEl.className="calc-expr-txt";exprEl.textContent=raw;
  const resEl=document.createElement("div");resEl.className="calc-res"+(isErr?" err":"");resEl.textContent=isErr?result:"= "+fmtResult(result);
  row.appendChild(exprEl);row.appendChild(resEl);
  histEl.prepend(row);
  this.value="";
  this.style.height="auto";
});
function clearHistory(){histEl.innerHTML=""}
</script>
</body>
</html>
